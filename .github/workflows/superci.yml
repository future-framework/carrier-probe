name: SuperCI
run-name: ${{ inputs.name }}
on:
  workflow_dispatch:
    inputs:
      name: { required: true }
      runner: { required: true }
permissions:
  id-token: write
jobs:
  carry:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Carry the job
        if: runner.os != 'Windows'
        shell: bash
        env:
          JIT: ${{ secrets.JIT }}
        run: |
          set -euo pipefail
          t() { echo "[$(date -u +%H:%M:%S)] $*"; }
          t "carrier started on $RUNNER_OS $RUNNER_ARCH"
          # GitHub's runner already on this machine: the running listener's folder, copied without its registration.
          exe=$(ps -axo comm= | grep -m1 '/Runner.Listener$' || true)
          root=$([ -n "$exe" ] && dirname "$(dirname "$exe")" || true)
          t "runner here: ${root:-none}"
          if [ -n "$root" ] && [ -x "$root/run.sh" ]; then
            mkdir -p "$RUNNER_TEMP/carried" && if [ "$RUNNER_OS" = macOS ]; then cp -cR "$root"/. "$RUNNER_TEMP/carried"/; else cp -R "$root"/. "$RUNNER_TEMP/carried"/; fi
            rm -rf "$RUNNER_TEMP/carried"/.runner "$RUNNER_TEMP/carried"/.credentials* "$RUNNER_TEMP/carried"/.env "$RUNNER_TEMP/carried/_diag" "$RUNNER_TEMP/carried/_work"
          else
            t "downloading a runner"
            v=$(curl -fsS https://api.github.com/repos/actions/runner/releases/latest | python3 -c 'import json,sys;print(json.load(sys.stdin)["tag_name"][1:])')
            os=$([ "$RUNNER_OS" = macOS ] && echo osx || echo linux); arch=$([ "$RUNNER_ARCH" = ARM64 ] && echo arm64 || echo x64)
            mkdir -p "$RUNNER_TEMP/carried" && curl -fsSL "https://github.com/actions/runner/releases/download/v$v/actions-runner-$os-$arch-$v.tar.gz" | tar -xz -C "$RUNNER_TEMP/carried"
          fi
          t "runner ready"
          cd "$RUNNER_TEMP/carried" && ./run.sh --jitconfig "$JIT" 2>&1 | sed -u 's/^/  runner: /'
          t "runner ended"
      - name: Carry the job (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          JIT: ${{ secrets.JIT }}
        run: |
          function t($m) { Write-Output ("[{0}] {1}" -f (Get-Date).ToUniversalTime().ToString('HH:mm:ss'), $m) }
          t "carrier started on $env:RUNNER_OS $env:RUNNER_ARCH"
          $exe = (Get-Process Runner.Listener -ErrorAction SilentlyContinue | Select-Object -First 1).Path
          $root = if ($exe) { Split-Path (Split-Path $exe) } else { $null }
          t "runner here: $root"
          $dest = Join-Path $env:RUNNER_TEMP 'carried'
          if ($root -and (Test-Path (Join-Path $root 'run.cmd'))) {
            New-Item -ItemType Directory -Force $dest | Out-Null
            Copy-Item -Recurse -Force (Join-Path $root '*') $dest
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue (Join-Path $dest '.runner'),(Join-Path $dest '.credentials*'),(Join-Path $dest '.env'),(Join-Path $dest '_diag'),(Join-Path $dest '_work')
          } else {
            t "downloading a runner"
            $v = (Invoke-RestMethod https://api.github.com/repos/actions/runner/releases/latest).tag_name.Substring(1)
            $zip = Join-Path $env:RUNNER_TEMP 'runner.zip'
            Invoke-WebRequest "https://github.com/actions/runner/releases/download/v$v/actions-runner-win-x64-$v.zip" -OutFile $zip
            Expand-Archive $zip $dest
          }
          t "runner ready"
          Set-Location $dest; & .\run.cmd --jitconfig $env:JIT
          t "runner ended"
